<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Editor — Alan Shahed</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Clean, focused writing environment */
    :root {
      --ui-border: #e0e0e0;
      --ui-bg-subtle: #f8f8f8;
      --ui-btn-bg: #1a1a1a;
      --ui-btn-text: #ffffff;
      --ui-accent: #0056b3;
      --ui-success: #15803d;
      --ui-success-bg: #f0fdf4;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ui-border: #333333;
        --ui-bg-subtle: #1e1e1e;
        --ui-btn-bg: #e0e0e0;
        --ui-btn-text: #121212;
        --ui-accent: #66b0ff;
        --ui-success: #4ade80;
        --ui-success-bg: #14281a;
      }
    }

    body {
      max-width: 820px;
      margin: 30px auto 60px;
      padding: 0 20px;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .app-header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .header-links a {
      font-size: 0.9rem;
      margin-left: 1rem;
    }

    /* Meta inputs (Title, Date, Slug) */
    .editor-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .title-input {
      width: 100%;
      font-family: inherit;
      font-size: 1.8rem;
      font-weight: 700;
      padding: 0.6rem 0;
      border: none;
      border-bottom: 2px solid var(--border);
      background: transparent;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    .title-input:focus {
      border-bottom-color: var(--ui-accent);
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      align-items: center;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .meta-field {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .meta-input {
      font-family: inherit;
      font-size: 0.88rem;
      padding: 0.35rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    .meta-input:focus {
      border-color: var(--ui-accent);
    }

    /* Tabs & Toolbar */
    .toolbar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .tool-group {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
    }

    .tool-btn {
      font-family: inherit;
      font-size: 0.85rem;
      background: var(--ui-bg-subtle);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.35rem 0.65rem;
      cursor: pointer;
    }

    .tool-btn:hover {
      background: var(--border);
    }

    .view-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .view-btn {
      font-family: inherit;
      font-size: 0.85rem;
      border: none;
      padding: 0.35rem 0.8rem;
      background: var(--bg);
      color: var(--text-muted);
      cursor: pointer;
    }

    .view-btn.active {
      background: var(--ui-btn-bg);
      color: var(--ui-btn-text);
      font-weight: 500;
    }

    /* Content Area */
    .writing-area {
      width: 100%;
      min-height: 420px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.95rem;
      line-height: 1.65;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      resize: vertical;
      box-sizing: border-box;
      margin-top: 0.75rem;
    }

    .writing-area:focus {
      border-color: var(--ui-accent);
    }

    /* Preview pane */
    .preview-pane {
      display: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2rem;
      margin-top: 0.75rem;
      min-height: 420px;
      background: var(--bg);
    }

    /* Publish Action Row */
    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .publish-btn {
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      background: var(--ui-btn-bg);
      color: var(--ui-btn-text);
      border: none;
      border-radius: 6px;
      padding: 0.7rem 1.6rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: opacity 0.2s;
    }

    .publish-btn:hover {
      opacity: 0.88;
    }

    .publish-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Status & Alerts */
    .status-banner {
      display: none;
      margin-top: 1.25rem;
      padding: 1rem 1.25rem;
      border-radius: 6px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .status-banner.success {
      display: block;
      background: var(--ui-success-bg);
      border: 1px solid var(--ui-success);
      color: var(--ui-success);
    }

    .status-banner.error {
      display: block;
      background: #fef2f2;
      border: 1px solid #ef4444;
      color: #b91c1c;
    }

    /* Past posts list */
    .recent-posts {
      margin-top: 3.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .recent-posts h3 {
      font-size: 1.1rem;
      margin-bottom: 0.8rem;
    }

    .recent-list {
      list-style: none;
      padding: 0;
      font-size: 0.95rem;
    }

    .recent-list li {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      border-bottom: 1px dashed var(--border);
    }

    .hint {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div>
      <h1>Alan's Blog Publisher</h1>
      <p class="hint">Type your post below &bull; 1-click automatic publish to GitHub</p>
    </div>
    <div class="header-links">
      <a href="https://alanshahed22.github.io" target="_blank" rel="noopener">View Live Blog &rarr;</a>
      <a href="index.html" target="_blank">Local Preview &rarr;</a>
    </div>
  </header>

  <main class="editor-section">
    <!-- Title -->
    <div>
      <input type="text" id="postTitle" class="title-input" placeholder="Post Title (e.g. My Next Project)" autofocus>
    </div>

    <!-- Metadata row -->
    <div class="meta-row">
      <div class="meta-field">
        <label for="postDate">Date:</label>
        <input type="date" id="postDate" class="meta-input">
      </div>
      <div class="meta-field">
        <label for="postSlug">File / URL Slug:</label>
        <input type="text" id="postSlug" class="meta-input" placeholder="auto-generated.html" style="width: 260px;">
      </div>
    </div>

    <!-- Formatting Tools & View Switcher -->
    <div class="toolbar-row">
      <div class="tool-group">
        <button type="button" class="tool-btn" onclick="insertMarkup('## ', '')">H2</button>
        <button type="button" class="tool-btn" onclick="insertMarkup('### ', '')">H3</button>
        <button type="button" class="tool-btn" onclick="insertMarkup('**', '**')"><strong>B</strong></button>
        <button type="button" class="tool-btn" onclick="insertMarkup('*', '*')"><em>I</em></button>
        <button type="button" class="tool-btn" onclick="insertMarkup('- ', '')">List</button>
        <button type="button" class="tool-btn" onclick="insertMarkup('> ', '')">Quote</button>
        <button type="button" class="tool-btn" onclick="insertMarkup('`', '`')">Code</button>
        <button type="button" class="tool-btn" onclick="insertMarkup('```\n', '\n```')">Code Block</button>
        <button type="button" class="tool-btn" onclick="insertMarkup('[Link Title](', ')')">Link</button>
      </div>

      <div class="view-toggle">
        <button type="button" id="btnEdit" class="view-btn active" onclick="switchView('edit')">Write</button>
        <button type="button" id="btnPreview" class="view-btn" onclick="switchView('preview')">Preview</button>
      </div>
    </div>

    <!-- Textarea for writing -->
    <textarea id="postContent" class="writing-area" placeholder="Write your post here. You can write plain text paragraphs (separated by blank lines), Markdown, or standard HTML tags.

Example:
Here is my first paragraph explaining what I built.

## Why this matters
More details about the project.

- Step 1: Gather components
- Step 2: Assemble and calibrate"></textarea>

    <!-- Preview Pane -->
    <div id="previewPane" class="preview-pane">
      <article>
        <h1 id="prevTitle">Title Preview</h1>
        <p><time id="prevDate">Date</time></p>
        <div id="prevContent"></div>
      </article>
    </div>

    <!-- Action Row -->
    <div class="action-row">
      <span class="hint">Clicking publish saves the HTML, updates your homepage index, and pushes to GitHub.</span>
      <button type="button" id="publishBtn" class="publish-btn" onclick="publishPost()">
        <span>🚀 Publish to GitHub</span>
      </button>
    </div>

    <!-- Status message -->
    <div id="statusBanner" class="status-banner"></div>

    <!-- Recent Posts Section -->
    <div class="recent-posts">
      <h3>Existing Posts in Repository</h3>
      <ul id="recentList" class="recent-list">
        <li>Loading existing posts...</li>
      </ul>
    </div>
  </main>

  <script>
    // Set default date to today (local YYYY-MM-DD)
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('postDate').value = today;

    const titleInput = document.getElementById('postTitle');
    const slugInput = document.getElementById('postSlug');
    const contentInput = document.getElementById('postContent');
    const publishBtn = document.getElementById('publishBtn');
    const statusBanner = document.getElementById('statusBanner');
    let userEditedSlug = false;

    // Auto-generate slug as user types title
    slugInput.addEventListener('input', () => {
      userEditedSlug = true;
    });

    titleInput.addEventListener('input', () => {
      if (!userEditedSlug) {
        const val = titleInput.value.toLowerCase().trim()
          .replace(/[^\w\s-]/g, '')
          .replace(/[\s_-]+/g, '-')
          .replace(/^-+|-+$/g, '');
        slugInput.value = val ? val + '.html' : '';
      }
    });

    // Formatting insertion helper
    function insertMarkup(prefix, suffix) {
      const el = contentInput;
      const start = el.selectionStart;
      const end = el.selectionEnd;
      const selected = el.value.substring(start, end);
      const replacement = prefix + (selected || 'text') + suffix;
      el.value = el.value.substring(0, start) + replacement + el.value.substring(end);
      el.focus();
      el.setSelectionRange(start + prefix.length, start + prefix.length + (selected ? selected.length : 4));
    }

    // View switcher (Write vs Preview)
    function switchView(mode) {
      const btnEdit = document.getElementById('btnEdit');
      const btnPreview = document.getElementById('btnPreview');
      const previewPane = document.getElementById('previewPane');

      if (mode === 'preview') {
        btnEdit.classList.remove('active');
        btnPreview.classList.add('active');
        contentInput.style.display = 'none';
        previewPane.style.display = 'block';
        renderPreview();
      } else {
        btnPreview.classList.remove('active');
        btnEdit.classList.add('active');
        previewPane.style.display = 'none';
        contentInput.style.display = 'block';
        contentInput.focus();
      }
    }

    function renderPreview() {
      const title = titleInput.value.trim() || 'Untitled Post';
      const dateVal = document.getElementById('postDate').value;
      const content = contentInput.value.trim();

      document.getElementById('prevTitle').textContent = title;
      document.getElementById('prevDate').textContent = dateVal || today;

      // Simple client-side preview converter
      let html = '';
      const lines = content.split('\n');
      for (const line of lines) {
        const stripped = line.trim();
        if (!stripped) continue;
        if (stripped.startsWith('### ')) {
          html += `<h3>${escapeHtml(stripped.slice(4))}</h3>`;
        } else if (stripped.startsWith('## ')) {
          html += `<h2>${escapeHtml(stripped.slice(3))}</h2>`;
        } else if (stripped.startsWith('# ')) {
          html += `<h2>${escapeHtml(stripped.slice(2))}</h2>`;
        } else if (stripped.startsWith('- ')) {
          html += `<ul><li>${escapeHtml(stripped.slice(2))}</li></ul>`;
        } else if (stripped.startsWith('> ')) {
          html += `<blockquote><p>${escapeHtml(stripped.slice(2))}</p></blockquote>`;
        } else {
          html += `<p>${formatInline(stripped)}</p>`;
        }
      }
      document.getElementById('prevContent').innerHTML = html || '<p><em>(No content yet)</em></p>';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatInline(text) {
      let t = escapeHtml(text);
      t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
      t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      return t;
    }

    // Publish action
    async function publishPost() {
      const title = titleInput.value.trim();
      const slug = slugInput.value.trim();
      const date = document.getElementById('postDate').value;
      const content = contentInput.value.trim();

      if (!title) {
        alert('Please enter a title for your post.');
        titleInput.focus();
        return;
      }

      if (!content) {
        alert('Please write some content before publishing.');
        contentInput.focus();
        return;
      }

      publishBtn.disabled = true;
      publishBtn.innerHTML = '<span>⏳ Publishing & Pushing to GitHub...</span>';
      statusBanner.className = 'status-banner';
      statusBanner.style.display = 'none';

      try {
        const res = await fetch('/api/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, slug, date, content })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          statusBanner.className = 'status-banner success';
          statusBanner.innerHTML = `
            <strong>✓ Successfully published to GitHub!</strong><br>
            • Post file: <code>${data.localFile}</code><br>
            • Live URL: <a href="${data.liveUrl}" target="_blank" rel="noopener"><strong>${data.liveUrl}</strong> ↗</a><br>
            <span style="font-size:0.85em;color:inherit;opacity:0.85;">(GitHub Pages typically takes 1–2 minutes to refresh the live site).</span>
          `;
          loadExistingPosts();
        } else {
          statusBanner.className = 'status-banner error';
          statusBanner.innerHTML = `<strong>Error publishing:</strong><br><pre style="margin-top:0.5rem;font-size:0.85em;">${escapeHtml(data.error || 'Unknown error occurred.')}</pre>`;
        }
      } catch (err) {
        statusBanner.className = 'status-banner error';
        statusBanner.innerHTML = `<strong>Network or server error:</strong> ${escapeHtml(err.message)}`;
      } finally {
        publishBtn.disabled = false;
        publishBtn.innerHTML = '<span>🚀 Publish to GitHub</span>';
      }
    }

    // Load existing posts
    async function loadExistingPosts() {
      try {
        const res = await fetch('/api/posts');
        const posts = await res.json();
        const list = document.getElementById('recentList');
        if (!posts || posts.length === 0) {
          list.innerHTML = '<li>No posts found.</li>';
          return;
        }
        list.innerHTML = posts.map(p => `
          <li>
            <a href="posts/${p.slug}" target="_blank"><strong>${escapeHtml(p.title)}</strong></a>
            <span style="color:var(--text-muted);font-size:0.85rem;">${p.dateDisplay || p.date || p.slug}</span>
          </li>
        `).join('');
      } catch (e) {
        console.error('Failed to load posts', e);
      }
    }

    loadExistingPosts();
  </script>

</body>
</html>
